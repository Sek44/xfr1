<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Additions - Exercices</title><style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#f3f6fb;color:#233047;margin:0;padding:16px}main{max-width:760px;margin:auto}a{color:#2064c7}button{font:inherit;border:2px solid #cad5e5;border-radius:12px;padding:12px 16px;background:white;color:#233047;cursor:pointer}button.active,.primary{background:#2064c7;color:white;border-color:#2064c7}button:disabled{opacity:.5}.answer-display{font-size:1.8rem;font-weight:700;min-height:64px;width:180px;max-width:100%;border:2px solid #9aacc8;border-radius:12px;padding:12px;text-align:center;background:#f8faff}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:330px;margin:16px 0}.keypad button{font-size:1.6rem;font-weight:650;min-height:64px;touch-action:manipulation}.keypad button.erase{font-size:1.15rem}.keypad button:active{background:#dbeafe}.categories{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.panel,.score{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #1e3d6812}.score{display:flex;justify-content:space-between;align-items:center;border:2px solid #dae5f6}.score strong{font-size:1.8rem;color:#175fc4}.question{font-size:clamp(2rem,7vw,3rem);font-weight:bold;margin:24px 0}input{font:inherit;font-size:1.7rem;width:170px;max-width:100%;border:2px solid #9aacc8;border-radius:12px;padding:12px;text-align:center}.feedback{min-height:42px;font-weight:bold;margin:16px 0}.good{color:#177447}.bad{color:#bd3535}.muted{color:#637188}
</style></head><body><main><p><a href="./">← Accueil</a></p><h1>Additions</h1><p>Choisis une catégorie, puis calcule les 10 additions.</p><div id="categories" class="categories"></div><div id="score" class="score"></div><div id="panel" class="panel"></div></main><script>
"use strict";
const ranges={"0-10":[0,10],"10-100":[10,100],"100-1000":[100,1000],"1000-10000":[1000,10000],"Toutes catégories":null};
let category="10-100",questions=[],index=0,score=0,failed=false,correct=false,answer="";
const el=id=>document.getElementById(id);
function randint(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function newSession(c){category=c;index=0;score=0;failed=false;correct=false;answer="";questions=[];const seen=new Set();while(questions.length<10){const range=ranges[category]||ranges[Object.keys(ranges)[randint(0,3)]];const a=randint(range[0],range[1]),b=randint(range[0],range[1]),key=a+","+b;if(seen.has(key))continue;seen.add(key);questions.push({a,b,result:a+b})}render()}
function save(){try{const key="exercices_francais_scores";const h=JSON.parse(localStorage.getItem(key)||"[]");h.unshift({date:new Date().toISOString(),tab:"math",category:"Additions "+category,score,total:10});localStorage.setItem(key,JSON.stringify(h.slice(0,100)))}catch{}}
function verify(){if(correct||answer.trim()==="")return;if(/^\d+$/.test(answer.trim())&&Number(answer.trim())===questions[index].result){correct=true;if(!failed)score++}else failed=true;render()}
function next(){if(!correct)return;index++;answer="";failed=false;correct=false;if(index===10)save();render()}
function render(){const cats=el("categories");cats.replaceChildren();for(const c of Object.keys(ranges)){const b=document.createElement("button");b.textContent=c;b.className=c===category?"active":"";b.onclick=()=>newSession(c);cats.append(b)}
const sc=el("score");sc.replaceChildren();sc.textContent="Score actuel";const strong=document.createElement("strong");strong.textContent=score+" / 10";sc.append(strong);
const p=el("panel");p.replaceChildren();if(index===10){p.innerHTML="<h2>Exercice terminé !</h2>";const t=document.createElement("p");t.textContent="Score : "+score+" / 10.";p.append(t);const b=document.createElement("button");b.className="primary";b.textContent="Recommencer";b.onclick=()=>newSession(category);p.append(b);return}
const progress=document.createElement("p");progress.className="muted";progress.textContent="Calcul "+(index+1)+" / 10";p.append(progress);
const q=document.createElement("div");q.className="question";q.textContent=questions[index].a+" + "+questions[index].b+" = ?";p.append(q);
const display=document.createElement("div");display.className="answer-display";display.setAttribute("aria-label","Résultat saisi");display.setAttribute("role","status");display.textContent=answer||" ";p.append(display);
const keypad=document.createElement("div");keypad.className="keypad";
function edit(value){if(correct)return;if(value==="clear")answer="";else if(value==="erase")answer=answer.slice(0,-1);else if(answer.length<6)answer+=value;display.textContent=answer||" ";button.disabled=!answer.length}
for(const value of ["1","2","3","4","5","6","7","8","9","Effacer","0","⌫"]){const key=document.createElement("button");key.type="button";key.textContent=value;key.className=value==="Effacer"||value==="⌫"?"erase":"";key.disabled=correct;key.onclick=()=>edit(value==="Effacer"?"clear":value==="⌫"?"erase":value);keypad.append(key)}p.append(keypad);
const feedback=document.createElement("div");feedback.className="feedback "+(correct?"good":failed?"bad":"");feedback.textContent=correct?(failed?"Bonne correction ! Aucun point pour ce calcul.":"Bravo ! +1 point"):failed?"Essaie encore ! Corrige ton résultat puis vérifie à nouveau.":"";feedback.setAttribute("role","status");p.append(feedback);
const button=document.createElement("button");button.className="primary";button.textContent=correct?(index===9?"Voir mon score":"Calcul suivant"):"Vérifier";button.disabled=!correct&&!answer.trim();button.onclick=correct?next:verify;p.append(button)
}
newSession(category);
</script></body></html>
