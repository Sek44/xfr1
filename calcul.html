<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Additions - Exercices</title><style>
*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:#f3f6fb;color:#233047;margin:0;padding:8px 12px}main{max-width:760px;margin:auto}a{color:#2064c7}button{font:inherit;border:2px solid #cad5e5;border-radius:10px;padding:8px 12px;background:white;color:#233047;cursor:pointer}button.active,.primary{background:#2064c7;color:white;border-color:#2064c7}button:disabled{opacity:.5}.answer-display{font-size:1.8rem;font-weight:700;min-height:48px;width:160px;max-width:100%;border:2px solid #9aacc8;border-radius:12px;padding:6px;text-align:center;background:#f8faff}.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:290px;margin:8px 0}.keypad button{font-size:1.6rem;font-weight:650;min-height:44px;touch-action:manipulation}.keypad button.erase{font-size:1.15rem}.keypad button:active{background:#dbeafe}.categories{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.setting{background:white;border-radius:12px;padding:9px}.setting label{display:block;font-weight:650;font-size:.9rem;margin-bottom:5px}.setting select{width:100%;font:inherit;padding:7px;border:1px solid #9aacc8;border-radius:8px;background:white}@media(max-width:420px){.settings{grid-template-columns:1fr}}.panel,.score{background:white;border-radius:16px;padding:12px 16px;margin:8px 0;box-shadow:0 4px 18px #1e3d6812}.score{display:flex;justify-content:space-between;align-items:center;border:2px solid #dae5f6}.score strong{font-size:1.8rem;color:#175fc4}.question{font-size:clamp(2rem,7vw,3rem);font-weight:bold;margin:8px 0}input{font:inherit;font-size:1.7rem;width:170px;max-width:100%;border:2px solid #9aacc8;border-radius:12px;padding:12px;text-align:center}.feedback{min-height:25px;font-weight:bold;margin:6px 0}.good{color:#177447}.bad{color:#bd3535}.muted{color:#637188}
</style><link rel="stylesheet" href="./shared.css"><style>.settings{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:420px){.settings{grid-template-columns:repeat(2,minmax(0,1fr))}.setting{padding:6px}.setting select{font-size:.85rem;padding:6px}}.panel{padding:12px 14px}.progress{font-size:.85rem;margin:0 0 6px;color:#637188}.equation-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin:8px 0 12px;min-width:0}.question{font-size:clamp(1.3rem,5.5vw,2.5rem);line-height:1.2;white-space:nowrap;margin:0;flex:0 1 auto;min-width:0}.answer-display{width:auto;min-width:76px;max-width:160px;flex:1 1 95px;font-size:clamp(1.3rem,5vw,2rem);min-height:52px;display:flex;align-items:center;justify-content:center}.keypad{max-width:300px;margin:6px auto 10px;gap:6px}.keypad button{min-height:44px;min-width:0;padding:8px 4px}.keypad button.erase{font-size:clamp(.75rem,2.2vw,1rem);padding:8px 2px;white-space:nowrap}.exercise-actions{display:flex;align-items:center;gap:12px;justify-content:center}.exercise-actions .primary{min-width:145px;min-height:44px;font-weight:700}.feedback{text-align:center;margin:5px 0;min-height:22px}.panel .progress{text-align:left}@media(min-width:650px) and (orientation:landscape){.panel{max-width:100%}.keypad{max-width:300px;grid-template-columns:repeat(3,minmax(0,1fr))}.keypad button{min-height:48px}.equation-row{justify-content:center}.answer-display{flex:0 1 160px}}@media(max-width:370px){.equation-row{gap:6px}.question{font-size:clamp(1.15rem,5vw,1.7rem)}.answer-display{min-width:65px;min-height:46px}.panel{padding:10px}}.score{margin:8px 0}.score .progress-label{font-size:.95rem;color:#637188;font-weight:650}.score strong{font-size:1.8rem}.equation-row{justify-content:center;gap:12px;margin:16px auto 14px}.question{font-size:clamp(2rem,7vw,3.25rem);font-weight:750}.answer-display{flex:0 1 160px;min-width:88px;max-width:160px;min-height:60px;font-size:clamp(1.8rem,6vw,2.6rem)}@media(max-width:390px){.question{font-size:clamp(1.75rem,6.8vw,2.5rem)}.equation-row{gap:8px}.answer-display{flex-basis:110px;min-width:72px;min-height:52px}}</style></head><body><main><nav class="page-nav"><a class="nav-link" href="./">← Accueil</a><a class="nav-link" href="./scores.html?game=calcul">▤ Mes scores</a></nav><h1 style="margin:4px 0">Additions</h1><div id="categories" class="settings"></div><div id="score" class="score"></div><div id="panel" class="panel"></div></main><script src="./scores.js"></script><script src="./game-common.js"></script><script>
"use strict";
const levels={"1":{label:"1 · Unités (1 à 9)",values:Array.from({length:9},(_,i)=>i+1)},"2":{label:"2 · Dizaines (10 à 90)",values:Array.from({length:9},(_,i)=>(i+1)*10)},"3":{label:"3 · Centaines (100 à 900)",values:Array.from({length:9},(_,i)=>(i+1)*100)},"4":{label:"4 · Dizaines + unités (11 à 99)",values:Array.from({length:89},(_,i)=>i+11).filter(n=>n%10!==0)},"5":{label:"5 · Centaines + dizaines (110 à 990)",values:Array.from({length:89},(_,i)=>(i+11)*10).filter(n=>n%100!==0)}};
const ranges={"0-10":[0,10],"10-100":[10,100],"100-1000":[100,1000],"1000-10000":[1000,10000],"Toutes catégories":null};
let range="10-100",category="1",questions=[],answer="",lastQuestionIndex=0;
const game=ExerciseGame.create({onChange:()=>{if(game.index!==lastQuestionIndex){answer="";lastQuestionIndex=game.index}render()},onFinish:({score,total})=>ExerciseScores.save({tab:"math",category:"Additions "+range+" / niveau "+category,score,total})});
const el=id=>document.getElementById(id);
function randint(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function newSession(){answer="";questions=[];const seen=new Set(),values=levels[category].values,allRanges=range==="Toutes catégories"?Object.values(ranges).filter(Boolean):[ranges[range]];const possible=allRanges.flatMap(([min,max])=>values.filter(b=>min+b<=max).map(b=>({min,max,b})));if(!possible.length){game.reset(0);return}let attempts=0;while(questions.length<10&&attempts++<3000){const {min,max,b}=possible[randint(0,possible.length-1)],a=randint(min,max-b),key=a+","+b;if(seen.has(key)||a<min||a>max||a+b>max)continue;seen.add(key);questions.push({a,b,result:a+b})}game.reset(questions.length)}
function verify(){if(answer.trim()&&!game.correct)game.validate(/^\d+$/.test(answer.trim())&&Number(answer.trim())===questions[game.index].result)}
function next(){game.next()}
function render(){const cats=el("categories");cats.replaceChildren();function selector(title,items,current,onChange){const wrap=document.createElement("div");wrap.className="setting";const label=document.createElement("label");label.textContent=title;const select=document.createElement("select");for(const [value,name] of items){const opt=document.createElement("option");opt.value=value;opt.textContent=name;select.append(opt)}select.value=current;select.onchange=()=>onChange(select.value);wrap.append(label,select);cats.append(wrap)}selector("Catégorie",Object.keys(ranges).map(x=>[x,x]),range,v=>{range=v;newSession()});selector("Difficulté",Object.entries(levels).map(([k,v])=>[k,v.label]),category,v=>{category=v;newSession()});
const sc=el("score");game.progress(sc,"Calcul");
const p=el("panel");p.replaceChildren();if(!questions.length){const message=document.createElement("p");message.textContent="Cette difficulté ne permet aucune addition dans la catégorie choisie. Sélectionne une autre difficulté ou catégorie.";p.append(message);return}if(game.index===game.total){game.finish(p,newSession);return}

const equation=document.createElement("div");equation.className="equation-row";const q=document.createElement("div");q.className="question";q.textContent=questions[game.index].a+" + "+questions[game.index].b+" =";equation.append(q);
const display=document.createElement("div");display.className="answer-display";display.setAttribute("aria-label","Résultat saisi");display.setAttribute("role","status");display.textContent=answer||" ";equation.append(display);p.append(equation);
const keypad=document.createElement("div");keypad.className="keypad";
function edit(value){if(game.correct)return;if(value==="clear")answer="";else if(value==="erase")answer=answer.slice(0,-1);else if(answer.length<6)answer+=value;display.textContent=answer||" ";button.disabled=!answer.length}
for(const value of ["1","2","3","4","5","6","7","8","9","Effacer","0","⌫"]){const key=document.createElement("button");key.type="button";key.textContent=value;key.className=value==="Effacer"||value==="⌫"?"erase":"";key.disabled=game.correct;key.onclick=()=>edit(value==="Effacer"?"clear":value==="⌫"?"erase":value);keypad.append(key)}p.append(keypad);
const feedback=document.createElement("div");feedback.className="feedback "+(game.correct?"good":game.failed?"bad":"");feedback.textContent=game.correct?(game.failed?"Bonne correction ! Aucun point pour ce calcul.":"Bravo ! +1 point"):game.failed?"Essaie encore ! Corrige ton résultat puis vérifie à nouveau.":"";feedback.setAttribute("role","status");p.append(feedback);
const button=game.actionButton();button.disabled=!game.correct&&!answer.trim();button.onclick=game.correct?next:verify;const actions=document.createElement("div");actions.className="exercise-actions";actions.append(button);p.append(actions)
}
newSession();
</script></body></html>
