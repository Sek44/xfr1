name: Convert imported PNG assets to WebP
on:
  push:
    paths:
      - '.github/workflows/convert-import-webp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert PNG to WebP while preserving alpha
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for source in sorted(Path('docs/design/import').glob('*.png')):
              dest = source.with_suffix('.webp')
              with Image.open(source) as im:
                  im.save(dest, 'WEBP', quality=88, method=6, exact=True)
              print(f"{source} -> {dest}")
          PY
      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/import/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Convert imported design PNG assets to WebP"
            git push
          fi
