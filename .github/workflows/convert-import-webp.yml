name: Convert imported PNG assets to WebP
on:
  push:
    paths:
      - '.github/workflows/convert-import-webp.yml'
      - 'docs/design/import/nav-*.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert PNG to WebP while preserving alpha
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          imports = Path('docs/design/import')
          assets = Path('styles/themes/magical-academy/assets')
          assets.mkdir(parents=True, exist_ok=True)

          # Retain the existing import conversion for non-navigation artwork.
          for source in sorted(imports.glob('*.png')):
              if source.name.startswith('nav-'):
                  continue
              dest = source.with_suffix('.webp')
              if dest.exists():
                  continue
              with Image.open(source) as im:
                  im.save(dest, 'WEBP', quality=88, method=6, exact=True)
              print(f"{source} -> {dest}")

          # A 320px RGBA canvas provides high-DPI 52px navigation artwork.
          # All four layers have precisely the same dimensions and alignment.
          for name in ('nav-background', 'nav-back', 'nav-reset', 'nav-scores'):
              source = imports / f'{name}.png'
              dest = assets / f'{name}.webp'
              with Image.open(source) as im:
                  image = im.convert('RGBA')
                  image = image.resize((320, 320), Image.Resampling.LANCZOS)
                  image.save(dest, 'WEBP', quality=90, method=6, exact=True)
              print(f"{source} -> {dest}")
          PY
      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/import/*.webp styles/themes/magical-academy/assets/nav-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Convert navigation icon layers to optimized WebP assets"
            git push
          fi
