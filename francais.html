<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Français — Entraînement</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #f3f6fb;
        color: #233047;
        font-family: system-ui, Arial, sans-serif;
      }
      main {
        max-width: 760px;
        margin: auto;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2.1rem);
      }
      .tabs,
      .choices,
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        border: 2px solid #cad5e5;
        border-radius: 12px;
        padding: 12px 18px;
        background: white;
        color: #233047;
        cursor: pointer;
      }
      button.active,
      .selected,
      .primary {
        background: #2064c7;
        border-color: #2064c7;
        color: white;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .score-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: white;
        border: 2px solid #dae5f6;
        border-radius: 16px;
        padding: 12px 16px;
        margin-top: 8px;
        box-shadow: 0 4px 18px #1e3d6812;
      }
      .score-card[hidden] {
        display: none;
      }
      .score-card strong {
        font-size: 1.8rem;
        color: #175fc4;
      }
      .score-card .progress-label {
        font-size: 0.95rem;
        color: #637188;
        font-weight: 650;
      }
      .panel {
        background: white;
        border-radius: 18px;
        padding: clamp(14px, 3vw, 24px);
        margin-top: 8px;
        box-shadow: 0 4px 18px #1e3d6812;
      }
      .muted {
        color: #637188;
      }
      .sentence {
        font-size: clamp(1.4rem, 5vw, 2rem);
        line-height: 1.5;
        margin: 16px 0;
      }
      .word {
        white-space: nowrap;
      }
      .hole {
        display: inline-block;
        min-width: 0.55em;
        border-bottom: 3px solid #2064c7;
        text-align: center;
        color: #2064c7;
        font-weight: 700;
        line-height: 1.1;
      }
      .choices button {
        min-width: 75px;
        font-size: 1.35rem;
        font-weight: 700;
      }
      .feedback {
        min-height: 26px;
        margin-top: 10px;
        font-weight: 700;
        text-align: center;
      }
      .bad {
        color: #bd3535;
      }
      .good {
        color: #177447;
      }
      .actions {
        margin-top: 10px;
        justify-content: center;
      }
      .actions .primary {
        min-height: 44px;
        min-width: 145px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td,
      th {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }
    </style>
    <link rel="stylesheet" href="./shared.css?v=20261018-progress-cards" />
    <link rel="stylesheet" href="./score-view.css?v=20261018-state9" />
  </head>
  <body>
    <main>
      <nav class="page-nav page-header">
        <a
          class="nav-link nav-icon"
          href="./"
          aria-label="Retour à l’accueil"
          title="Accueil"
          ><svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="29"
            height="29"
            fill="none"
            stroke="#1757a7"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5m7-7-7 7 7 7" /></svg
        ></a>
        <h1 class="page-title">Français</h1>
        <a
          class="nav-link nav-icon"
          href="./scores.html?game=francais"
          aria-label="Voir les scores"
          title="Mes scores"
          ><svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="29"
            height="29"
            fill="none"
            stroke="#1757a7"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="3" width="16" height="18" rx="2" />
            <path d="M8 8h8M8 12h8M8 16h5" /></svg
        ></a>
      </nav>
      <p>Choisis les lettres manquantes et vérifie ta réponse.</p>
      <div class="tabs" id="tabs"></div>
      <div class="score-card" id="score-card" aria-live="polite"></div>
      <div class="panel" id="panel"></div>
    </main>
    <script src="./score-view.js?v=20261018-state9"></script>
    <script src="./scores.js?v=20261018-state9"></script>
    <script src="./game-ui.js?v=20261018-cleanup16"></script>
    <script src="./game-common.js?v=20261018-progress-cards"></script>
    <script src="./francais.js?v=20261018-cleanup16"></script>
  </body>
</html>
