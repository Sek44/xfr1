<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Français — Entraînement</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f3f6fb;color:#233047;font-family:system-ui,Arial,sans-serif}main{max-width:760px;margin:auto}h1{font-size:clamp(1.5rem,5vw,2.1rem)}.tabs,.choices,.actions{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;border:2px solid #cad5e5;border-radius:12px;padding:12px 18px;background:white;color:#233047;cursor:pointer}button.active,.selected,.primary{background:#2064c7;border-color:#2064c7;color:white}button:disabled{opacity:.45;cursor:default}.score-card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:white;border:2px solid #dae5f6;border-radius:16px;padding:12px 16px;margin-top:8px;box-shadow:0 4px 18px #1e3d6812}.score-card[hidden]{display:none}.score-card strong{font-size:1.8rem;color:#175fc4}.score-card .progress-label{font-size:.95rem;color:#637188;font-weight:650}.panel{background:white;border-radius:18px;padding:clamp(14px,3vw,24px);margin-top:8px;box-shadow:0 4px 18px #1e3d6812}.muted{color:#637188}.sentence{font-size:clamp(1.4rem,5vw,2rem);line-height:1.5;margin:16px 0}.word{white-space:nowrap}.hole{display:inline-block;min-width:1.6em;border-bottom:3px solid #2064c7;text-align:center;color:#2064c7;font-weight:700;line-height:1.1}.choices button{min-width:75px;font-size:1.35rem;font-weight:700}.feedback{min-height:26px;margin-top:10px;font-weight:700}.bad{color:#bd3535}.good{color:#177447}.actions{margin-top:10px;justify-content:center}.actions .primary{min-height:44px;min-width:145px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}
</style><link rel="stylesheet" href="./shared.css"></head><body><main><nav class="page-nav page-header"><a class="nav-link nav-icon" href="./" aria-label="Retour à l’accueil" title="Accueil"><svg viewBox="0 0 24 24" aria-hidden="true" width="29" height="29" fill="none" stroke="#1757a7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a><h1 class="page-title">Français</h1><a class="nav-link nav-icon" href="./scores.html?game=francais" aria-label="Voir les scores" title="Mes scores"><svg viewBox="0 0 24 24" aria-hidden="true" width="29" height="29" fill="none" stroke="#1757a7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></a></nav><p>Choisis les lettres manquantes et vérifie ta réponse.</p><div class="tabs" id="tabs"></div><div class="score-card" id="score-card" aria-live="polite"></div><div class="panel" id="panel"></div></main>
<script src="./scores.js"></script><script src="./game-common.js"></script><script>
"use strict";
const sets={
g:{name:"g / gu / ge",options:["g","gu","ge"],items:[
["Le garçon man","e une pomme.","g"],["La ","enon saute dans le pré.","gu"],["Le ","épard court très vite.","gu"],["Papa ran","e la voiture.","g"],["Le pi","on vole.","ge"],["La ","irafe a un long cou.","g"],["Le ","ide montre le chemin.","gu"],["Le boulan","er prépare du pain.","g"],["Le ","errier porte une épée.","gu"],["Nous man","ons à la cantine.","ge"],["Le sin","e grimpe aux arbres.","g"],["La ba","e est en or.","gu"],["Le ","énie sort de la lampe.","g"],["Le ma","icien fait un tour.","g"],["Le ","épard dort.","gu"],["La va","e arrive sur le sable.","gu"],["Le ","âteau est délicieux.","g"],["Il joue de la ","itare.","gu"],["La nei","e tombe.","g"],["Le ","éant porte un chapeau.","g"],["Le pi","on nage dans l'eau.","ge"],["Nous ran","ons nos affaires.","ge"],["L'oran","ade est fraîche.","ge"],["Le dra","on crache du feu.","g"]]},
c:{name:"c / ç",options:["c","ç"],items:[
["Le gar","on joue dehors.","ç"],["La le","on est facile.","ç"],["Il a re","u une lettre.","ç"],["Je lan","e le ballon.","c"],["Nous avan","ons doucement.","ç"],["Le ","itron est jaune.","c"],["La fa","ade est blanche.","ç"],["Le ","ygne nage.","c"],["Un gla","on flotte.","ç"],["La ","erise est rouge.","c"],["Nous tra","ons un cercle.","ç"],["Le ","iel est bleu.","c"],["Le ","adeau est emballé.","c"],["La balan","oire bouge.","ç"],["Elle ","ommence à lire.","c"],["Le ma","on construit un mur.","ç"],["Je pla","e mon livre ici.","c"],["Le ","entre est ouvert.","c"],["Nous effa","ons le tableau.","ç"],["Le ","afé est chaud.","c"]]}};
const SESSION_SIZE=10;
let tab="g",selected=null,lastQuestionIndex=0;
let questions=shuffleSession(tab);
const game=ExerciseGame.create({onChange:()=>{if(game.index!==lastQuestionIndex){selected=null;lastQuestionIndex=game.index}render()},onFinish:({score,total})=>ExerciseScores.save({tab,score,total})});
const make=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};

function shuffleSession(t){const shuffled=sets[t].items.slice();for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}return shuffled.slice(0,SESSION_SIZE)}
function switchTab(t){tab=t;selected=null;questions=shuffleSession(t);game.reset(questions.length)}
function select(v){if(!game.correct){selected=v;render()}}
function verify(){if(selected!==null&&!game.correct)game.validate(selected===questions[game.index][2])}
function advance(){selected=null;game.next()}
function render(){
const tabs=document.getElementById("tabs"),panel=document.getElementById("panel"),scoreCard=document.getElementById("score-card");tabs.replaceChildren();panel.replaceChildren();scoreCard.replaceChildren();scoreCard.hidden=false;
for(const [key,entry] of Object.entries(sets)){const b=make("button",tab===key?"active":"",entry.name);b.onclick=()=>switchTab(key);tabs.append(b)}


const data=sets[tab],total=questions.length;
game.progress(scoreCard,"Phrase");
if(game.index===total){game.finish(panel,()=>switchTab(tab));return}
const [before,after]=questions[game.index],sentence=make("div","sentence");const match=before.match(/^(.*?)([^\s]*)$/s),prefix=match[1],fragment=match[2];sentence.append(document.createTextNode(prefix));const word=make("span","word");word.append(document.createTextNode(fragment));const hole=make("span","hole",selected===null?"\u00a0":prefix===""&&fragment===""?selected.toUpperCase():selected);word.append(hole);const suffix=after.match(/^[^\s]*/)[0];word.append(document.createTextNode(suffix));sentence.append(word,document.createTextNode(after.slice(suffix.length)));panel.append(sentence);
const options=make("div","choices");for(const value of data.options){const b=make("button",selected===value?"selected":"",value);b.disabled=game.correct;b.onclick=()=>select(value);options.append(b)}panel.append(options);
const message=make("div","feedback "+(game.correct?"good":game.failed?"bad":""),game.correct?(game.failed?"Bonne correction ! Pas de point pour cette phrase.":"Bravo ! +1 point"):game.failed?"Essaie encore ! Tu peux changer ta réponse.":"");message.setAttribute("role","status");panel.append(message);
const actions=make("div","actions"),button=game.actionButton();button.disabled=!game.correct&&selected===null;button.onclick=game.correct?advance:verify;actions.append(button);panel.append(actions)
}
render();
</script></body></html>
