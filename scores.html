<!doctype html>
<html lang="fr" data-theme="magical-academy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mes scores — Entraînement</title>
    <link rel="stylesheet" href="./scores.css?v=20261104-classic" />
    <link rel="stylesheet" href="./shared.css?v=20261018-score-graph" />

    <link rel="stylesheet" href="./app-confirm.css?v=20261018-confirm14" />
    <link rel="stylesheet" href="./scores-theme.css?v=20261101-school" />
    <link rel="stylesheet" href="./school-common.css?v=20261102-questions" />
      <link rel="stylesheet" href="./styles/themes/magical-academy/theme.css?v=10-portrait-cover" />
    <link rel="stylesheet" href="./styles/themes/magical-academy/classic.css?v=1" />
  </head>
  <body class="school-page academy-page scores-page">
    <main>
      <nav class="page-nav page-header school-banner academy-banner" data-academy-header data-title="Mes scores" data-icon="scores" data-restart="false" data-scores="false" data-back-id="scores-back"></nav>
      <div class="filter">
        <a href="./scores.html" data-game="all">Tous</a
        ><a href="./scores.html?game=francais" data-game="francais">Français</a
        ><a href="./scores.html?game=conjugaison" data-game="conjugaison">Conjugaison</a
        ><a href="./scores.html?game=calcul" data-game="calcul">Calcul</a
        ><a href="./scores.html?game=space" data-game="space">Mission calcul</a
        ><a href="./scores.html?game=magic" data-game="magic">Mission magique</a>
      </div>
      <section id="history" class="history-panel"></section>
    </main>
    <script src="./academy-header.js?v=1"></script>
    <script src="./app-confirm.js?v=20261018-confirm14"></script>
    <script src="./scores.js?v=20261101-conjugaison"></script>
    <script>
      "use strict";
      const game = new URLSearchParams(location.search).get("game");
      const selected = ["francais", "conjugaison", "calcul", "space", "magic"].includes(game)
        ? game
        : null;
      for (const link of document.querySelectorAll("[data-game]")) {
        if (link.dataset.game === (selected || "all")) {
          link.classList.add("active");
          link.setAttribute("aria-current", "page");
        }
      }
      const routes = {
        francais: "francais.html",
        conjugaison: "conjugaison.html",
        calcul: "calcul.html",
        space: "space.html",
        magic: "magic.html",
      };
      const params = new URLSearchParams(location.search);
      let origin = params.get("from");
      if (!Object.hasOwn(routes, origin)) {
        let referringGame = null;
        try {
          const ref = new URL(document.referrer);
          if (ref.origin === location.origin)
            referringGame = Object.keys(routes).find(
              (key) =>
                ref.pathname === new URL(routes[key], location.href).pathname,
            );
        } catch {}
        origin = referringGame || (Object.hasOwn(routes, game) ? game : null);
      }
      if (origin) {
        const back = document.getElementById("scores-back");
        back.href = "./" + routes[origin];
        back.setAttribute("aria-label", "Retour au jeu");
        back.title = "Retour au jeu";
        for (const link of document.querySelectorAll("[data-game]")) {
          const url = new URL(link.href);
          url.searchParams.set("from", origin);
          link.href = url.href;
        }
      }
      if (window.parent !== window) {
        const back = document.getElementById("scores-back");
        back.setAttribute("aria-label", "Retour au jeu");
        back.title = "Retour au jeu";
        back.addEventListener("click", (event) => {
          event.preventDefault();
          window.parent.postMessage(
            { type: "exercise-scores-back" },
            location.origin,
          );
        });
        for (const link of document.querySelectorAll("[data-game]"))
          link.addEventListener("click", (event) => {
            if (
              event.button === 0 &&
              !event.ctrlKey &&
              !event.metaKey &&
              !event.shiftKey &&
              !event.altKey
            ) {
              event.preventDefault();
              location.replace(link.href);
            }
          });
      }
      ExerciseScores.render(
        document.getElementById("history"),
        selected === "calcul" ? "math" : selected,
      );
    </script>
  </body>
</html>
