<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mes scores — Entraînement</title>
    <link rel="stylesheet" href="./shared.css?v=20261018-score-graph" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, Arial, sans-serif;
        background: #f3f6fb;
        color: #233047;
        margin: 0;
        padding: 16px;
      }
      main {
        max-width: 760px;
        margin: auto;
      }
      h1 {
        margin: 12px 0;
      }
      .filter {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter a {
        display: inline-block;
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid #b8cbe7;
        background: white;
        color: #1757a7;
        text-decoration: none;
        font-weight: 650;
      }
      .filter a.active {
        background: #2064c7;
        color: white;
        border-color: #2064c7;
      }
    </style>
    <link rel="stylesheet" href="./app-confirm.css?v=20261018-confirm14" />
  </head>
  <body>
    <main>
      <nav class="page-nav page-header">
        <a
          id="scores-back"
          class="nav-link nav-icon"
          href="./"
          aria-label="Retour à l’accueil"
          title="Accueil"
          ><svg
            viewBox="0 0 24 24"
            aria-hidden="true"
            width="29"
            height="29"
            fill="none"
            stroke="#1757a7"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M19 12H5m7-7-7 7 7 7" /></svg
        ></a>
        <h1 class="page-title">Mes scores</h1>
        <span aria-hidden="true"></span>
      </nav>
      <div class="filter">
        <a href="./scores.html" data-game="all">Tous</a
        ><a href="./scores.html?game=francais" data-game="francais">Français</a
        ><a href="./scores.html?game=calcul" data-game="calcul">Calcul</a
        ><a href="./scores.html?game=space" data-game="space">Mission calcul</a
        ><a href="./scores.html?game=magic" data-game="magic">Mission magique</a>
      </div>
      <section id="history" class="history-panel"></section>
    </main>
    <script src="./app-confirm.js?v=20261018-confirm14"></script>
    <script src="./scores.js?v=20261020-magic1"></script>
    <script>
      "use strict";
      const game = new URLSearchParams(location.search).get("game");
      const selected = ["francais", "calcul", "space", "magic"].includes(game)
        ? game
        : null;
      for (const link of document.querySelectorAll("[data-game]")) {
        if (link.dataset.game === (selected || "all")) {
          link.classList.add("active");
          link.setAttribute("aria-current", "page");
        }
      }
      const routes = {
        francais: "francais.html",
        calcul: "calcul.html",
        space: "space.html",
        magic: "magic.html",
      };
      const params = new URLSearchParams(location.search);
      let origin = params.get("from");
      if (!Object.hasOwn(routes, origin)) {
        let referringGame = null;
        try {
          const ref = new URL(document.referrer);
          if (ref.origin === location.origin)
            referringGame = Object.keys(routes).find(
              (key) =>
                ref.pathname === new URL(routes[key], location.href).pathname,
            );
        } catch {}
        origin = referringGame || (Object.hasOwn(routes, game) ? game : null);
      }
      if (origin) {
        const back = document.getElementById("scores-back");
        back.href = "./" + routes[origin];
        back.setAttribute("aria-label", "Retour au jeu");
        back.title = "Retour au jeu";
        for (const link of document.querySelectorAll("[data-game]")) {
          const url = new URL(link.href);
          url.searchParams.set("from", origin);
          link.href = url.href;
        }
      }
      if (window.parent !== window) {
        const back = document.getElementById("scores-back");
        back.setAttribute("aria-label", "Retour au jeu");
        back.title = "Retour au jeu";
        back.addEventListener("click", (event) => {
          event.preventDefault();
          window.parent.postMessage(
            { type: "exercise-scores-back" },
            location.origin,
          );
        });
        for (const link of document.querySelectorAll("[data-game]"))
          link.addEventListener("click", (event) => {
            if (
              event.button === 0 &&
              !event.ctrlKey &&
              !event.metaKey &&
              !event.shiftKey &&
              !event.altKey
            ) {
              event.preventDefault();
              location.replace(link.href);
            }
          });
      }
      ExerciseScores.render(
        document.getElementById("history"),
        selected === "calcul" ? "math" : selected,
      );
    </script>
  </body>
</html>
