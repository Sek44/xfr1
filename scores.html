<!doctype html>
<html lang="fr" data-theme="magical-academy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mes scores — Entraînement</title>
    <link rel="stylesheet" href="./styles/typography.css?v=1" />
    <link rel="stylesheet" href="./shared-components.css?v=20261107-history-cleanup" />

    <link rel="stylesheet" href="./app-confirm.css?v=20261107-history-cleanup" />
    <link rel="stylesheet" href="./school-base.css?v=20261107" />
    <link rel="stylesheet" href="./styles/themes/magical-academy/theme.css?v=width-lock-20261107" />
    <link rel="stylesheet" href="./styles/themes/magical-academy/components.css?v=20261107-css-consolidation" />
    <link rel="stylesheet" href="./styles/themes/magical-academy/scores.css?v=20261111-mastery-under-chart" />
  </head>
  <body class="school-page academy-page scores-page">
    <main class="academy-global-frame">
      <nav class="page-nav page-header school-banner academy-banner" data-academy-header data-title="Mes scores" data-icon="scores" data-restart="false" data-scores="false" data-back-id="scores-back"></nav>
      <nav class="filter academy-tabs academy-score-tabs" aria-label="Filtrer les scores">
        <div class="score-tab-group" aria-label="Exercices">
          <a class="academy-tab" href="./scores.html" data-game="all" aria-label="Tous les exercices">Tous</a>
          <a class="academy-tab" href="./scores.html?game=francais" data-game="francais">Français</a>
          <a class="academy-tab" href="./scores.html?game=conjugaison" data-game="conjugaison">Conjugaison</a>
          <a class="academy-tab" href="./scores.html?game=calcul" data-game="calcul">Calcul</a>
          <a class="academy-tab" href="./scores.html?game=monnaie" data-game="monnaie">Monnaie</a>
        </div>
        <div class="score-tab-group" aria-label="Missions">
          <a class="academy-tab" href="./scores.html?game=space" data-game="space">Mission calcul</a>
          <a class="academy-tab" href="./scores.html?game=magic" data-game="magic">Mission magique</a>
        </div>
      </nav>
      <nav id="score-subcategory-filter" class="score-subcategory-filter" aria-label="Filtrer par sous-catégorie" hidden></nav>
      <section
        id="score-chart"
        class="history-panel score-chart-panel"
        aria-label="Évolution du score"
      ></section>
      <section id="history" class="history-panel"></section>
    </main>
    <script src="./academy-header.js?v=20261111-score-origins"></script>
    <script src="./app-confirm.js?v=20261018-confirm14"></script>
    <script src="./reward-difficulties.js?v=20261111-admin1"></script>
    <script src="./reward-rules.js?v=20261111-max10"></script>
    <script src="./scores.js?v=20261111-plain-levels"></script>
    <script>
      "use strict";
      const game = new URLSearchParams(location.search).get("game");
      const selected = ["francais", "conjugaison", "calcul", "monnaie", "space", "magic"].includes(game)
        ? game
        : null;
      for (const link of document.querySelectorAll("[data-game]")) {
        if (link.dataset.game === (selected || "all")) {
          link.classList.add("active");
          link.setAttribute("aria-current", "page");
        }
      }
      const routes = {
        francais: "francais.html",
        conjugaison: "conjugaison.html",
        calcul: "calcul.html",
        monnaie: "monnaie.html",
        space: "space.html",
        magic: "magic.html",
      };
      const params = new URLSearchParams(location.search);
      // The selected score tab is not the page the visitor came from.
      // Preserve the explicit origin while changing games or subcategories.
      let origin = params.get("from");
      if (origin !== "home" && !Object.hasOwn(routes, origin)) {
        origin = "home";
        try {
          const ref = new URL(document.referrer);
          if (ref.origin === location.origin) {
            const referringGame = Object.keys(routes).find(
              (key) =>
                ref.pathname === new URL(routes[key], location.href).pathname,
            );
            if (referringGame) origin = referringGame;
          }
        } catch {}
      }
      if (origin !== "home") {
        const back = document.getElementById("scores-back");
        back.href = "./" + routes[origin];
        back.setAttribute("aria-label", "Retour au jeu");
        back.title = "Retour au jeu";
      }
      for (const link of document.querySelectorAll("[data-game]")) {
        const url = new URL(link.href);
        url.searchParams.set("from", origin);
        link.href = url.href;
      }
      if (window.parent !== window) {
        const back = document.getElementById("scores-back");
        back.setAttribute("aria-label", "Retour au jeu");
        back.title = "Retour au jeu";
        back.addEventListener("click", (event) => {
          event.preventDefault();
          window.parent.postMessage(
            { type: "exercise-scores-back" },
            location.origin,
          );
        });
        for (const link of document.querySelectorAll("[data-game]"))
          link.addEventListener("click", (event) => {
            if (
              event.button === 0 &&
              !event.ctrlKey &&
              !event.metaKey &&
              !event.shiftKey &&
              !event.altKey
            ) {
              event.preventDefault();
              location.replace(link.href);
            }
          });
      }
      const scoreGame = selected === "calcul" ? "math" : selected;
      const choices = ExerciseScores.subcategories(scoreGame);
      const savedSub = params.get("sub");
      // Calcul options normally come from recorded sessions. Show the current
      // difficulty even before the first session has been completed.
      if (scoreGame === "math" &&
          /^Additions (?:0-10|10-100|100-1000|1000-10000|Toutes catégories) \/ niveau [1-5]$/.test(savedSub || "") &&
          !choices.some(({ value }) => value === savedSub)) {
        choices.push({
          value: savedSub,
          label: savedSub.replace(/^Additions\s+/i, ""),
        });
      }
      const selectedSub = choices.some(({ value }) => value === savedSub)
        ? savedSub : null;
      if (choices.length) {
        const filter = document.getElementById("score-subcategory-filter");
        for (const choice of [
          { value: "", label: "Toutes" },
          ...choices,
        ]) {
          const link = document.createElement("a");
          const url = new URL(location.href);
          if (choice.value) url.searchParams.set("sub", choice.value);
          else url.searchParams.delete("sub");
          link.href = url.href;
          link.className = "score-subcategory-tab";
          link.textContent = choice.label;
          if (choice.value === (selectedSub || "")) {
            link.classList.add("active");
            link.setAttribute("aria-current", "page");
          }
          filter.append(link);
        }
        filter.hidden = false;
      }
      ExerciseScores.render(
        document.getElementById("history"),
        scoreGame,
        document.getElementById("score-chart"),
        selectedSub,
      );
    </script>
  </body>
</html>
