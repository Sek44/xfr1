<!doctype html>
<html lang="fr" data-theme="magical-academy">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#081c42" />
    <title>Entraînement</title>
    <link rel="stylesheet" href="./styles/typography.css?v=1" />
    <link rel="stylesheet" href="./home.css?v=frame-layout-20261107" />
    <link rel="stylesheet" href="./school-common.css?v=typography-1" />
    <link rel="stylesheet" href="./styles/themes/magical-academy/theme.css?v=width-lock-20261107" />
    <link rel="stylesheet" href="./styles/themes/magical-academy/classic.css?v=width-lock-20261107" />
    <link rel="stylesheet" href="./styles/themes/magical-academy/home-v3.css?v=activity-inset-20261107" />
  </head>
  <body class="academy-page academy-home-page">
    <main class="academy-global-frame">
      <nav class="page-nav page-header school-banner academy-banner academy-home-nav"
           data-academy-header data-home="true" data-scores="true"
           aria-label="Navigation de l’accueil"></nav>
      <header class="academy-hero">
        <div class="hero-plaque">
          <span class="hero-book-flourish hero-book-flourish--left" aria-hidden="true"></span>
          <span class="hero-book-flourish hero-book-flourish--right" aria-hidden="true"></span>
          <span class="hero-book" aria-hidden="true"></span>
          <span class="hero-plaque-jewel hero-plaque-jewel--left" aria-hidden="true"></span>
          <h1 id="welcome-title">Entraînement</h1>
          <span class="hero-plaque-jewel hero-plaque-jewel--right" aria-hidden="true"></span>
        </div>
      </header>

      <section class="daily-panel" aria-labelledby="daily-heading">
        <div class="daily-heading">
          <span class="daily-trophy" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path d="M13 7h22v13c0 10-5 15-11 15s-11-5-11-15z" fill="#f5bb31" stroke="#95601f" stroke-width="2.5" />
              <path d="M13 12H6v5c0 7 6 10 11 9M35 12h7v5c0 7-6 10-11 9" fill="none" stroke="#c18b2e" stroke-width="3.5" stroke-linecap="round" />
              <path d="M24 35v6m-10 2h20m-16-3h12" stroke="#986520" stroke-width="3.5" stroke-linecap="round" />
              <path d="m24 12 2.4 5 5.5.8-4 4 .9 5.5-4.8-2.6-4.8 2.6.9-5.5-4-4 5.5-.8z" fill="#fff3b2" />
            </svg>
          </span>
          <h2 id="daily-heading">Mes progrès aujourd’hui</h2>
        </div>
        <div class="daily-stats" role="status" aria-live="polite" aria-atomic="true">
          <div class="daily-stat">
            <span class="daily-stat-icon daily-stat-target" aria-hidden="true">
              <svg viewBox="0 0 48 48">
                <circle cx="23" cy="26" r="18" fill="#fce6d6" stroke="#bd303a" stroke-width="4" />
                <circle cx="23" cy="26" r="11" fill="#fff" stroke="#e4544c" stroke-width="4" />
                <circle cx="23" cy="26" r="4" fill="#c92d35" />
                <path d="m24 25 13-15m-1-5 2 5 5 1-5 3-2-1" fill="none" stroke="#21693c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <strong id="daily-points">0 exercices</strong>
          </div>
          <div class="daily-stat">
            <span class="daily-stat-icon daily-stat-hourglass" aria-hidden="true">
              <svg viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="19" fill="#fffdf4" stroke="#263252" stroke-width="3.5" />
                <path d="M24 12v13l9 5" fill="none" stroke="#263252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <strong id="daily-minutes">0 min de jeu</strong>
          </div>
        </div>
        <p id="daily-error" class="daily-error" hidden></p>
      </section>

      <nav class="activity-grid" aria-label="Activités éducatives">
        <a class="activity-card activity-french" href="./francais.html">
          <span class="activity-icon" aria-hidden="true">Aa</span>
          <span class="activity-body"><span class="subject">FRANÇAIS</span><strong>Orthographe</strong></span>
          <span class="activity-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></span>
        </a>
        <a class="activity-card activity-conjugation" href="./conjugaison.html">
          <span class="activity-icon" aria-hidden="true">Je</span>
          <span class="activity-body"><span class="subject">FRANÇAIS</span><strong>Conjugaison</strong></span>
          <span class="activity-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></span>
        </a>
        <a class="activity-card activity-math" href="./calcul.html">
          <span class="activity-icon" aria-hidden="true">+</span>
          <span class="activity-body"><span class="subject">MATHÉMATIQUES</span><strong>Calcul</strong></span>
          <span class="activity-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></span>
        </a>
        <a class="activity-card activity-space" href="./space.html">
          <span class="activity-icon" aria-hidden="true">✦</span>
          <span class="activity-body"><span class="subject">MISSION</span><strong>Mission calcul</strong></span>
          <span class="activity-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></span>
        </a>
        <a class="activity-card activity-magic" href="./magic.html">
          <span class="activity-icon" aria-hidden="true">✧</span>
          <span class="activity-body"><span class="subject">MISSION</span><strong>Mission magique</strong></span>
          <span class="activity-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></span>
        </a>
      </nav>
    </main>
    <script src="./academy-header.js?v=home-nav-20261107"></script>
    <script src="./daily-exercises.js?v=20261106-3min"></script>
    <script>
      DailyExercises.mountStats(
        document.getElementById("daily-points"),
        document.getElementById("daily-minutes"),
        document.getElementById("daily-error")
      );

    </script>
  </body>
</html>
